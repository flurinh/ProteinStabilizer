[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-stabilizer"
version = "0.1.0"
description = "ESM-C embedding-delta models for mutation stability ranking"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.83",
  "h5py>=3.10",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pyarrow>=23.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
esmc = ["esm==3.2.1.post1"]
esmc6b = [
  "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]
test = ["pytest>=8"]

[project.scripts]
protein-stabilizer = "protein_stabilizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
